services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ai-service

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "5000:5000"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      - PORT=8000
      - AI_BASE_URL=${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      - AI_API_KEY=${AI_API_KEY:-ollama}
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
