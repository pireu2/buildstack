services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ai-service

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - CORE_API_URL=http://api:5000/api/v1/core
      - AI_BASE_URL=${DOCKER_AI_BASE_URL:-http://host.docker.internal:11434/v1}
      - AI_API_KEY=${AI_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-mistral:latest}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-768}
      - VECTOR_SCHEMA=${VECTOR_SCHEMA:-ai}
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
